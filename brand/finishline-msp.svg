<svg xmlns="http://www.w3.org/2000/svg" width="232" height="32" viewBox="0 0 232 32" role="img" aria-label="finishline | MSP">
  <title>finishline | MSP</title>
  <defs>
    <filter id="fl-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- surface: #111c21 · square corners per Mission Control (no radius) -->
  <rect width="232" height="32" fill="#111c21"/>
  <!-- mark: 10px live square · #d1ea99 -->
  <rect x="12" y="11" width="10" height="10" fill="#d1ea99" filter="url(#fl-glow)"/>
  <!-- lockup: JetBrains Mono, 14px, tracking 0.05em, case preserved exactly -->
  <text x="30" y="21.5" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="0.7" fill="#dce1fb" style="text-transform:none">finishline <tspan fill="#d1ea99">|</tspan> MSP</text>
</svg>
